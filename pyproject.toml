[project]
name = "weather-bureau-light"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mike Ratford", email = "mike.ratford@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.3",
]

[project.scripts]
weather-bureau-light = "weather_bureau_light:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
