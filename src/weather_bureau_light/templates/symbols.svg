{# Weather symbols drawn for this project. The Met Office's own artwork is Crown
   copyright, so these are lookalikes keyed by significant weather code. #}

{% macro defs() %}
<svg class="sprite-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <g id="g-sun"><circle cx="12" cy="12" r="5.2" class="s-sun"/>
      {% for a in range(0, 360, 45) %}
      <line x1="12" y1="3.2" x2="12" y2="1" class="s-ray" transform="rotate({{ a }} 12 12)"/>
      {% endfor %}
    </g>
    <g id="g-moon"><path class="s-moon" d="M16.5 14.6A6.6 6.6 0 0 1 9.4 7.5a6.6 6.6 0 1 0 7.1 7.1z"/></g>
    <g id="g-cloud"><path class="s-cloud" d="M8 20h9.2a4.3 4.3 0 0 0 .5-8.6 6.2 6.2 0 0 0-11.7-1.2A4.4 4.4 0 0 0 8 20z"/></g>
    <g id="g-cloud-dark"><path class="s-cloud-dark" d="M8 20h9.2a4.3 4.3 0 0 0 .5-8.6 6.2 6.2 0 0 0-11.7-1.2A4.4 4.4 0 0 0 8 20z"/></g>

    <symbol id="wx-clear" viewBox="0 0 24 24"><use href="#g-sun"/></symbol>
    <symbol id="wx-clear-night" viewBox="0 0 24 24"><use href="#g-moon"/></symbol>

    <symbol id="wx-partly-cloudy" viewBox="0 0 24 24">
      <g transform="translate(4 -2) scale(0.72)"><use href="#g-sun"/></g><use href="#g-cloud"/>
    </symbol>
    <symbol id="wx-partly-cloudy-night" viewBox="0 0 24 24">
      <g transform="translate(4 -2) scale(0.72)"><use href="#g-moon"/></g><use href="#g-cloud"/>
    </symbol>

    <symbol id="wx-cloudy" viewBox="0 0 24 24"><use href="#g-cloud"/></symbol>
    <symbol id="wx-overcast" viewBox="0 0 24 24"><use href="#g-cloud-dark"/></symbol>

    <symbol id="wx-mist" viewBox="0 0 24 24">
      <use href="#g-cloud"/>
      <line x1="4" y1="22" x2="20" y2="22" class="s-mist"/>
      <line x1="6" y1="19" x2="18" y2="19" class="s-mist"/>
    </symbol>
    <symbol id="wx-fog" viewBox="0 0 24 24">
      <use href="#g-cloud-dark"/>
      <line x1="3" y1="22" x2="21" y2="22" class="s-mist"/>
      <line x1="5" y1="19" x2="19" y2="19" class="s-mist"/>
      <line x1="7" y1="16" x2="17" y2="16" class="s-mist"/>
    </symbol>

    <symbol id="wx-drizzle" viewBox="0 0 24 24">
      <use href="#g-cloud"/>
      <line x1="9" y1="21" x2="8.4" y2="22.6" class="s-rain"/>
      <line x1="13" y1="21" x2="12.4" y2="22.6" class="s-rain"/>
    </symbol>

    <symbol id="wx-rain-light" viewBox="0 0 24 24">
      <use href="#g-cloud"/>
      <line x1="9" y1="20.5" x2="8" y2="23.4" class="s-rain"/>
      <line x1="13.5" y1="20.5" x2="12.5" y2="23.4" class="s-rain"/>
    </symbol>
    <symbol id="wx-rain-heavy" viewBox="0 0 24 24">
      <use href="#g-cloud-dark"/>
      <line x1="7.5" y1="20.5" x2="6.5" y2="23.6" class="s-rain"/>
      <line x1="11.5" y1="20.5" x2="10.5" y2="23.6" class="s-rain"/>
      <line x1="15.5" y1="20.5" x2="14.5" y2="23.6" class="s-rain"/>
    </symbol>

    <symbol id="wx-shower-light" viewBox="0 0 24 24">
      <g transform="translate(4 -2) scale(0.72)"><use href="#g-sun"/></g><use href="#g-cloud"/>
      <line x1="9" y1="20.5" x2="8" y2="23.4" class="s-rain"/>
      <line x1="13.5" y1="20.5" x2="12.5" y2="23.4" class="s-rain"/>
    </symbol>
    <symbol id="wx-shower-light-night" viewBox="0 0 24 24">
      <g transform="translate(4 -2) scale(0.72)"><use href="#g-moon"/></g><use href="#g-cloud"/>
      <line x1="9" y1="20.5" x2="8" y2="23.4" class="s-rain"/>
      <line x1="13.5" y1="20.5" x2="12.5" y2="23.4" class="s-rain"/>
    </symbol>
    <symbol id="wx-shower-heavy" viewBox="0 0 24 24">
      <g transform="translate(4 -2) scale(0.72)"><use href="#g-sun"/></g><use href="#g-cloud-dark"/>
      <line x1="7.5" y1="20.5" x2="6.5" y2="23.6" class="s-rain"/>
      <line x1="11.5" y1="20.5" x2="10.5" y2="23.6" class="s-rain"/>
      <line x1="15.5" y1="20.5" x2="14.5" y2="23.6" class="s-rain"/>
    </symbol>
    <symbol id="wx-shower-heavy-night" viewBox="0 0 24 24">
      <g transform="translate(4 -2) scale(0.72)"><use href="#g-moon"/></g><use href="#g-cloud-dark"/>
      <line x1="7.5" y1="20.5" x2="6.5" y2="23.6" class="s-rain"/>
      <line x1="11.5" y1="20.5" x2="10.5" y2="23.6" class="s-rain"/>
      <line x1="15.5" y1="20.5" x2="14.5" y2="23.6" class="s-rain"/>
    </symbol>

    <symbol id="wx-sleet" viewBox="0 0 24 24">
      <use href="#g-cloud"/>
      <line x1="9" y1="20.5" x2="8" y2="23.4" class="s-rain"/>
      <g class="s-snow" transform="translate(13.2 22)">
        <line x1="-1.6" y1="0" x2="1.6" y2="0"/><line x1="0" y1="-1.6" x2="0" y2="1.6"/>
      </g>
    </symbol>
    <symbol id="wx-sleet-night" viewBox="0 0 24 24"><use href="#wx-sleet"/></symbol>

    <symbol id="wx-snow-light" viewBox="0 0 24 24">
      <use href="#g-cloud"/>
      <g class="s-snow" transform="translate(9.5 22)">
        <line x1="-1.7" y1="0" x2="1.7" y2="0"/><line x1="0" y1="-1.7" x2="0" y2="1.7"/>
        <line x1="-1.2" y1="-1.2" x2="1.2" y2="1.2"/><line x1="-1.2" y1="1.2" x2="1.2" y2="-1.2"/>
      </g>
      <g class="s-snow" transform="translate(14.5 22)">
        <line x1="-1.7" y1="0" x2="1.7" y2="0"/><line x1="0" y1="-1.7" x2="0" y2="1.7"/>
        <line x1="-1.2" y1="-1.2" x2="1.2" y2="1.2"/><line x1="-1.2" y1="1.2" x2="1.2" y2="-1.2"/>
      </g>
    </symbol>
    <symbol id="wx-snow-light-night" viewBox="0 0 24 24"><use href="#wx-snow-light"/></symbol>
    <symbol id="wx-snow-heavy" viewBox="0 0 24 24">
      <use href="#g-cloud-dark"/>
      {% for x in [7.5, 12, 16.5] %}
      <g class="s-snow" transform="translate({{ x }} 22)">
        <line x1="-1.7" y1="0" x2="1.7" y2="0"/><line x1="0" y1="-1.7" x2="0" y2="1.7"/>
        <line x1="-1.2" y1="-1.2" x2="1.2" y2="1.2"/><line x1="-1.2" y1="1.2" x2="1.2" y2="-1.2"/>
      </g>
      {% endfor %}
    </symbol>
    <symbol id="wx-snow-heavy-night" viewBox="0 0 24 24"><use href="#wx-snow-heavy"/></symbol>

    <symbol id="wx-hail" viewBox="0 0 24 24">
      <use href="#g-cloud"/>
      <circle cx="9" cy="22" r="1.3" class="s-hail"/>
      <circle cx="13.5" cy="22" r="1.3" class="s-hail"/>
    </symbol>
    <symbol id="wx-hail-night" viewBox="0 0 24 24"><use href="#wx-hail"/></symbol>

    <symbol id="wx-thunder" viewBox="0 0 24 24">
      <use href="#g-cloud-dark"/>
      <path class="s-bolt" d="M12.8 19.2h3.1l-2.4 2.6h2.2l-5 4.4 1.4-3.6h-2.4z"/>
    </symbol>
    <symbol id="wx-thunder-night" viewBox="0 0 24 24"><use href="#wx-thunder"/></symbol>

    <symbol id="wx-unknown" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" class="s-unknown"/>
      <text x="12" y="16.5" class="s-unknown-text" text-anchor="middle">?</text>
    </symbol>
  </defs>
</svg>
{% endmacro %}

{# Night variants exist for some sprites only; fall back to the day artwork. #}
{% set HAS_NIGHT = ['clear', 'partly-cloudy', 'shower-light', 'shower-heavy',
                    'sleet', 'snow-light', 'snow-heavy', 'hail', 'thunder'] %}

{% macro icon(sprite, night=False, label='') %}
{%- set name = sprite ~ '-night' if night and sprite in HAS_NIGHT else sprite -%}
<svg class="wx wx-{{ sprite }}" role="img" aria-label="{{ label }}" viewBox="0 0 24 24">
  <title>{{ label }}</title><use href="#wx-{{ name }}"/>
</svg>
{%- endmacro %}
